# Sweeps abandoned guest accounts (and their files) once a day.
#
# Guests who never saved their work are permanent rows in auth.users and count
# toward Supabase's monthly active users, so they need clearing. This has to be
# a script rather than a SQL cron job: deleting storage.objects rows in SQL
# strands the file bytes in the bucket. scripts/purge-stale-guests.mjs removes
# files through the Storage API first, then deletes the users.
#
# Staleness is measured from last activity, not signup, and a guest who still
# owns files is skipped rather than orphaned. See README.md, "Guest limits".
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  Project Settings → API. Bypasses RLS — this job's
#                              environment is the only place it should live.
name: Purge stale guests

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      older_than:
        description: "Inactivity window, as a Postgres interval"
        default: "30 days"
      dry_run:
        description: "List what would be removed without removing it"
        type: boolean
        default: false

# Public repository: run logs are world-readable, so the script prints counts
# only, and the job gets a read-only GITHUB_TOKEN. Secrets are never exposed
# to pull requests — this workflow has no pull_request trigger, and forks do
# not receive them.
permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          node scripts/purge-stale-guests.mjs
          --older-than "${{ github.event.inputs.older_than || '30 days' }}"
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
